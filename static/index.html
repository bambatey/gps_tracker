<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Harita</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        #map {
            flex: 1;
            background: #2a2a2a;
        }
        .sidebar {
            width: 350px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            background: #0d0d0d;
        }
        .sidebar-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .sidebar-header p {
            font-size: 12px;
            color: #999;
        }
        .device-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .device-item {
            background: #2a2a2a;
            border-left: 4px solid;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .device-item:hover {
            background: #333;
        }
        .device-item.active {
            background: #333;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        .device-name {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .device-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
        }
        .device-status.active {
            background: #4CAF50;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .device-stats {
            font-size: 12px;
            color: #999;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
        }
        .stat-label {
            color: #666;
        }
        .stat-value {
            color: #aaa;
            font-family: 'Courier New', monospace;
        }
        .device-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-small {
            flex: 1;
            padding: 6px 10px;
            background: #333;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-small:hover {
            background: #444;
            color: #fff;
        }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #333;
            background: #0d0d0d;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .connection-status {
            font-size: 11px;
            padding: 8px;
            text-align: center;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .connection-status.connected {
            background: #1b5e20;
            color: #4CAF50;
        }
        .connection-status.disconnected {
            background: #b71c1c;
            color: #ff6b6b;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }
        .stat-card-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        .stat-card-value {
            font-size: 16px;
            font-weight: 700;
        }
        .no-device {
            padding: 30px 15px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        /* Leaflet dark theme */
        .leaflet-container {
            background: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>📍 GPS Tracker</h1>
                <p>Canlı Harita İzleyicisi</p>
            </div>

            <div class="device-list" id="deviceList">
                <div class="no-device">Cihaz bekleniyor...</div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status" id="connectionStatus">
                    ⚫ Bağlanıyor...
                </div>
                <button class="btn-primary" id="refreshBtn">Yenile</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.origin;
        const map = L.map('map').setView([41.0082, 28.9784], 12); // İstanbul
        let ws = null;
        let devices = {};
        let deviceMarkers = {};
        let devicePolylines = {};

        // Leaflet tile layer (dark theme)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            maxZoom: 19
        }).addTo(map);

        function connectWebSocket() {
            const wsUrl = `${SERVER_URL.replace('http', 'ws')}/ws/0`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateConnectionStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'location_update') {
                    updateDeviceLocation(data);
                }
            };

            ws.onerror = () => {
                updateConnectionStatus(false);
            };

            ws.onclose = () => {
                updateConnectionStatus(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.textContent = '🟢 Bağlandı';
                status.className = 'connection-status connected';
            } else {
                status.textContent = '🔴 Bağlantı Yok';
                status.className = 'connection-status disconnected';
            }
        }

        async function loadDevices() {
            try {
                const res = await fetch(`${SERVER_URL}/api/devices`);
                const deviceList = await res.json();

                for (const device of deviceList) {
                    if (!devices[device.id]) {
                        devices[device.id] = device;
                        await loadDeviceTracks(device.id);
                        renderDeviceList();
                    }
                }
            } catch (e) {
                console.error('Cihaz yükleme hatası:', e);
            }
        }

        async function loadDeviceTracks(deviceId) {
            try {
                const res = await fetch(`${SERVER_URL}/api/device/${deviceId}/tracks`);
                const tracks = await res.json();

                if (tracks.length === 0) return;

                const device = devices[deviceId];
                const points = tracks.map(t => [t.latitude, t.longitude]);

                // Marker
                if (points.length > 0) {
                    const lastPoint = points[points.length - 1];
                    if (deviceMarkers[deviceId]) {
                        deviceMarkers[deviceId].setLatLng(lastPoint);
                    } else {
                        deviceMarkers[deviceId] = L.circleMarker(lastPoint, {
                            radius: 8,
                            fillColor: device.color,
                            color: device.color,
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).bindPopup(`<strong>${device.name}</strong>`).addTo(map);
                    }
                }

                // Polyline
                if (devicePolylines[deviceId]) {
                    map.removeLayer(devicePolylines[deviceId]);
                }
                devicePolylines[deviceId] = L.polyline(points, {
                    color: device.color,
                    weight: 2,
                    opacity: 0.7
                }).addTo(map);
            } catch (e) {
                console.error('Track yükleme hatası:', e);
            }
        }

        function updateDeviceLocation(data) {
            const { device_id, device_name, device_color, latitude, longitude } = data;

            if (!devices[device_id]) {
                devices[device_id] = {
                    id: device_id,
                    name: device_name,
                    color: device_color
                };
                renderDeviceList();
            }

            const point = [latitude, longitude];

            // Update marker
            if (deviceMarkers[device_id]) {
                deviceMarkers[device_id].setLatLng(point);
            } else {
                deviceMarkers[device_id] = L.circleMarker(point, {
                    radius: 8,
                    fillColor: device_color,
                    color: device_color,
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).bindPopup(`<strong>${device_name}</strong>`).addTo(map);
            }

            // Update polyline
            if (!devicePolylines[device_id]) {
                devicePolylines[device_id] = L.polyline([], {
                    color: device_color,
                    weight: 2,
                    opacity: 0.7
                }).addTo(map);
            }
            devicePolylines[device_id].addLatLng(point);

            // Auto-pan to latest marker
            map.panTo(point);
        }

        function renderDeviceList() {
            const list = document.getElementById('deviceList');

            if (Object.keys(devices).length === 0) {
                list.innerHTML = '<div class="no-device">Cihaz bekleniyor...</div>';
                return;
            }

            list.innerHTML = Object.values(devices).map(device => `
                <div class="device-item" style="border-color: ${device.color}">
                    <div class="device-name">
                        <div class="device-status active"></div>
                        ${device.name}
                    </div>
                    <div class="device-stats">
                        <div class="stat-row">
                            <span class="stat-label">ID</span>
                            <span class="stat-value">#${device.id}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Renk</span>
                            <span class="stat-value" style="color: ${device.color}">●</span>
                        </div>
                    </div>
                    <div class="device-actions">
                        <button class="btn-small" onclick="focusDevice(${device.id})">Odakla</button>
                        <button class="btn-small" onclick="exportGPX(${device.id})">GPX</button>
                    </div>
                </div>
            `).join('');
        }

        function focusDevice(deviceId) {
            if (devicePolylines[deviceId]) {
                const bounds = devicePolylines[deviceId].getBounds();
                map.fitBounds(bounds);
            }
        }

        async function exportGPX(deviceId) {
            const device = devices[deviceId];
            window.location.href = `${SERVER_URL}/api/export/gpx/${deviceId}`;
        }

        // Initialize
        connectWebSocket();
        loadDevices();
        setInterval(loadDevices, 5000);

        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadDevices();
        });
    </script>
</body>
</html>
