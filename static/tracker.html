<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Gönderici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .info-section {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #666;
            font-weight: 500;
        }
        .info-value {
            color: #333;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status.active {
            background: #4CAF50;
            animation: pulse 1s infinite;
        }
        .status.inactive {
            background: #999;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }
        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f44336;
            color: white;
            flex: 1;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
        }
        .btn-secondary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .message.success {
            background: #c8e6c9;
            color: #2e7d32;
        }
        .message.error {
            background: #ffcdd2;
            color: #c62828;
        }
        .message.info {
            background: #bbdefb;
            color: #1565c0;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 GPS Tracker</h1>
        <p class="subtitle">Konum gönderici</p>

        <div id="message"></div>

        <div class="controls">
            <input
                type="text"
                id="deviceName"
                placeholder="Cihaz adı (ör: Araç-1)"
                maxlength="30"
            >
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">BAŞLAT</button>
            <button id="stopBtn" class="btn btn-secondary" disabled>DUR</button>
        </div>

        <div class="info-section">
            <div class="info-row">
                <span class="info-label"><span class="status inactive" id="statusDot"></span>Durum</span>
                <span class="info-value" id="status">Hazır</span>
            </div>
            <div class="info-row">
                <span class="info-label">Enlem</span>
                <span class="info-value" id="latitude">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Boylam</span>
                <span class="info-value" id="longitude">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Doğruluk</span>
                <span class="info-value" id="accuracy">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Hız</span>
                <span class="info-value" id="speed">--</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Veri Sayısı</div>
                <div class="stat-value" id="pointCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Çalışma Süresi</div>
                <div class="stat-value" id="duration">00:00</div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.origin;
        let ws = null;
        let deviceId = null;
        let isTracking = false;
        let watchId = null;
        let lastLocation = null;
        let startTime = null;
        let pointCount = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const deviceNameInput = document.getElementById('deviceName');
        const messageDiv = document.getElementById('message');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('status');

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 5000);
        }

        async function createDevice() {
            const name = deviceNameInput.value || `Cihaz-${Date.now()}`;
            const color = `#${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}`;
            try {
                const res = await fetch(`${SERVER_URL}/api/device?name=${encodeURIComponent(name)}&color=${encodeURIComponent(color)}`, {
                    method: 'POST'
                });
                const data = await res.json();
                deviceId = data.id;
                return true;
            } catch (e) {
                showMessage(`Hata: Cihaz oluşturulamadı`, 'error');
                return false;
            }
        }

        function connectWebSocket() {
            const wsUrl = `${SERVER_URL.replace('http', 'ws')}/ws/${deviceId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                showMessage('✓ Sunucuya bağlandı', 'success');
            };

            ws.onerror = () => {
                showMessage('Bağlantı hatası', 'error');
            };

            ws.onclose = () => {
                if (isTracking) {
                    setTimeout(connectWebSocket, 3000);
                }
            };
        }

        async function startTracking() {
            if (!deviceNameInput.value.trim()) {
                showMessage('Lütfen cihaz adı giriniz', 'error');
                return;
            }

            if (!navigator.geolocation) {
                showMessage('GPS desteklenmiyor', 'error');
                return;
            }

            if (!(await createDevice())) return;

            connectWebSocket();

            isTracking = true;
            startTime = Date.now();
            pointCount = 0;

            startBtn.disabled = true;
            deviceNameInput.disabled = true;
            stopBtn.disabled = false;
            statusDot.className = 'status active';
            statusText.textContent = 'İzleniyor...';

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    const speed = position.coords.speed || 0;

                    lastLocation = { latitude, longitude, accuracy };
                    pointCount++;

                    document.getElementById('latitude').textContent = latitude.toFixed(6);
                    document.getElementById('longitude').textContent = longitude.toFixed(6);
                    document.getElementById('accuracy').textContent = accuracy.toFixed(1) + ' m';
                    document.getElementById('speed').textContent = (speed * 3.6).toFixed(1) + ' km/h';
                    document.getElementById('pointCount').textContent = pointCount;

                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            latitude,
                            longitude,
                            accuracy
                        }));
                    }
                },
                (error) => {
                    showMessage(`GPS Hatası: ${error.message}`, 'error');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        }

        function stopTracking() {
            isTracking = false;
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            if (ws) {
                ws.close();
            }

            startBtn.disabled = false;
            deviceNameInput.disabled = false;
            stopBtn.disabled = true;
            statusDot.className = 'status inactive';
            statusText.textContent = 'Durduruldu';

            showMessage(`✓ ${pointCount} veri noktası kaydedildi`, 'success');
        }

        function updateDuration() {
            if (!isTracking) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('duration').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);

        setInterval(updateDuration, 1000);
    </script>
</body>
</html>
